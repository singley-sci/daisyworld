# Builds the Daisyworld Shiny app into a static Shinylive site and publishes
# it to GitHub Pages. Runs on every push to main, and can be run by hand from
# the Actions tab (workflow_dispatch).
name: Deploy Daisyworld to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run supersede one already in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install the shinylive package
        shell: Rscript {0}
        run: install.packages("shinylive")

      - name: Export the app to a static site in _site/
        shell: Rscript {0}
        run: shinylive::export("app", "_site")

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
